<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>四六级口语 v3.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#eef1f7;color:#1c2135;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:14px 14px 90px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.header h1{font-size:19px;font-weight:800}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(30,40,90,.08)}
.word-card{text-align:center;padding:24px 16px}
.word-big{font-size:32px;font-weight:800;margin:12px 0}
.btn{width:100%;padding:13px;border:none;border-radius:14px;background:#3671e9;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin:6px 0}
.btn:active{transform:scale(.96)}
.btn-sec{background:#6b7280}
.btn-ok{background:#22c55e}
.btn-warn{background:#f59e0b}
.row{display:flex;gap:8px}
.row .btn{flex:1}
input{width:100%;padding:12px 14px;border:1px solid #e5e8f0;border-radius:14px;font-size:16px;margin:8px 0}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e8f0;padding:8px 0}
.tabbar button{flex:1;border:none;background:none;padding:8px;cursor:pointer;font-size:13px;color:#8a90a6}
.tabbar button.active{color:#3671e9;font-weight:700}
.page{display:none}
.page.active{display:block}
.tip{font-size:13px;color:#8a90a6;margin:8px 0}
.result{margin:10px 0;padding:10px;border-radius:10px;background:#f4f6f8;min-height:40px;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📖 四六级口语助手 <small style="font-size:11px;color:#8a90a6">v3.0</small></h1>
  </div>

  <!-- 单词页 -->
  <div id="page-word" class="page active">
    <div class="card word-card">
      <div style="font-size:13px;color:#8a90a6">第 <b id="idx">0</b> / <b id="total">0</b> 词</div>
      <div class="word-big" id="word">----</div>
      <button class="btn" onclick="speak()">🔊 听发音</button>
      <input id="ans" placeholder="输入单词拼写" onkeydown="if(event.key==='Enter')check()">
      <div class="row">
        <button class="btn-ok" onclick="check()">核对</button>
        <button class="btn-sec" onclick="next()">下一个 →</button>
      </div>
      <div class="result" id="result">点下面按钮加载单词开始学</div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">📥 加载单词</div>
      <button class="btn" onclick="loadDefault()">一键加载四级高频词</button>
      <div class="tip">加载后自动按10个一组分组</div>
    </div>
  </div>

  <!-- 语法页 -->
  <div id="page-grammar" class="page">
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">📝 零基础语法</div>
      <div id="grammarList"></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <button class="active" onclick="showPage('word',this)">📖 单词</button>
    <button onclick="showPage('grammar',this)">📝 语法</button>
  </div>
</div>

<script>
var words = [];
var cur = 0;

var cet4Words = ["abandon","ability","absorb","academic","accept","access","accident","account","achieve","acquire","active","actual","adapt","addition","admit","adopt","adult","advance","advantage","adventure","advertise","advice","affair","affect","afford","afraid","agency","agenda","agreement","aim","airline","alarm","album","alcohol","alike","alive","allow","almost","alone","along","aloud","alphabet","already","also","alternative","always","amazing","ambition","amount","analyze","ancient"];

function loadDefault(){
  words = cet4Words;
  cur = 0;
  document.getElementById('total').innerText = words.length;
  showWord();
  alert("已加载 " + words.length + " 个单词！");
}

function showWord(){
  if(cur >= words.length){
    document.getElementById('word').innerText = "🎉 学完了！";
    return;
  }
  document.getElementById('idx').innerText = cur + 1;
  document.getElementById('word').innerText = "🔊 听发音默写";
  document.getElementById('ans').value = "";
  document.getElementById('result').innerText = "";
}

function speak(){
  if(!words.length){ alert("请先点「一键加载四级高频词」！"); return; }
  if(cur >= words.length) return;
  var w = encodeURIComponent(words[cur]);
  var audio = new Audio("https://dict.youdao.com/dictvoice?audio=" + w + "&type=2");
  audio.play().catch(function(){
    audio.src = "https://dict.youdao.com/dictvoice?audio=" + w + "&type=1";
    audio.play();
  });
}

function check(){
  if(!words.length) return;
  var ans = document.getElementById('ans').value.trim().toLowerCase();
  var real = words[cur].toLowerCase();
  if(ans === real){
    document.getElementById('result').innerText = "✅ 正确！" + words[cur];
  } else {
    document.getElementById('result').innerText = "❌ 正确答案：" + words[cur];
  }
}

function next(){
  cur++;
  showWord();
}

function showPage(name, btn){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
}

var grammarData = [
  "名词：表示人/事/物，如 book(书)、apple(苹果)",
  "动词：表示动作，如 run(跑)、eat(吃)",
  "形容词：修饰名词，如 red(红的)、big(大的)",
  "介词：in(在…里)、on(在…上)、at(在…点)、to(到)",
  "代词：I(我)、you(你)、he(他)、she(她)",
  "一般现在时：经常做的事，He likes apples.",
  "一般过去时：过去做的事，I went to park yesterday.",
  "一般将来时：will + 动词，I will study tomorrow.",
  "现在进行时：be + doing，I am reading now.",
  "宾语从句：I think (that) you are right."
];

function renderGrammar(){
  var html = "";
  grammarData.forEach(function(g, i){
    html += '<div style="padding:10px 0;border-bottom:1px solid #e5e8f8"><b>' + (i+1) + '. </b>' + g + '</div>';
  });
  document.getElementById('grammarList').innerHTML = html;
}

renderGrammar();
</script>
</body>
</html>
